<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Empleados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f0f4f8; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: #1e3a5f !important; }
        .page-header { padding: 24px 0 16px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .search-box { border-radius: 8px; border: 1px solid #e0e0e0; padding: 10px 16px 10px 40px; width: 320px; font-size: 14px; }
        .search-wrapper { position: relative; display: inline-block; }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #aaa; }
        .table { margin: 0; }
        .table thead tr { border-bottom: 1px solid #f0f0f0; }
        .table thead th { background: white; color: #888; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; border: none; padding: 12px 16px; }
        .table tbody td { border: none; border-bottom: 1px solid #f8f8f8; padding: 12px 16px; vertical-align: middle; font-size: 14px; }
        .table tbody tr:hover { background-color: #f8faff; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); display: inline-flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 14px; }
        .emp-nombre { font-weight: 500; color: #1a1a2e; font-size: 14px; }
        .emp-codigo { font-size: 12px; color: #888; }
        .badge-area { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; background: #e8f4ff; color: #2d6a9f; }
        .btn-accion { width: 32px; height: 32px; border-radius: 8px; border: 1px solid #e0e0e0; background: white; display: inline-flex; align-items: center; justify-content: center; color: #666; font-size: 14px; cursor: pointer; transition: all 0.2s; }
        .btn-accion:hover { background: #f0f4f8; border-color: #ccc; }
        .btn-accion.danger:hover { background: #fff0f0; border-color: #ffcdd2; color: #e53935; }
        .btn-accion.warning:hover { background: #fffde7; border-color: #fff176; color: #f9a825; }
        .btn-accion.info:hover { background: #e3f2fd; border-color: #90caf9; color: #1976d2; }
        .footer-tabla { padding: 12px 16px; font-size: 13px; color: #888; display: flex; justify-content: space-between; border-top: 1px solid #f0f0f0; }
        .btn-nuevo { background: #1e3a5f; color: white; border: none; border-radius: 8px; padding: 9px 18px; font-size: 14px; font-weight: 500; }
        .btn-nuevo:hover { background: #2d6a9f; color: white; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand fw-bold"><i class="bi bi-people-fill me-2"></i>Sistema de Empleados</span>
    <div class="d-flex gap-2">
        <a href="/inicio" class="btn btn-outline-light btn-sm"><i class="bi bi-house me-1"></i>Inicio</a>
        <a href="/logout" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right me-1"></i>Cerrar Sesión</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="page-header d-flex justify-content-between align-items-center mb-3">
        <div>
            <h5 class="fw-bold mb-1" style="color:#1e3a5f;">Gestión de Empleados</h5>
            <p class="text-muted mb-0" style="font-size:13px;">Administra la información del personal de la empresa</p>
        </div>
        <a href="/empleados/nuevo" class="btn btn-nuevo"
           th:if="${rolUsuario == 'administrador' or rolUsuario == 'recursos humanos'}">
            <i class="bi bi-person-plus-fill me-1"></i>Nuevo Empleado
        </a>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <!-- Buscador -->
            <div class="p-3 border-bottom">
                <div class="search-wrapper">
                    <i class="bi bi-search search-icon"></i>
                    <input type="text" id="buscador" class="search-box form-control"
                           placeholder="Buscar por nombre, DNI, código, área...">
                </div>
            </div>

            <!-- Tabla -->
            <table class="table" id="tablaEmpleados">
                <thead>
                    <tr>
                        <th>CÓDIGO</th>
                        <th>EMPLEADO</th>
                        <th>DNI</th>
                        <th>ÁREA</th>
                        <th>SALARIO BASE</th>
                        <th>FECHA INGRESO</th>
                        <th>ACCIONES</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${empleados.isEmpty()}">
                        <td colspan="7" class="text-center text-muted py-4">No se encontraron empleados.</td>
                    </tr>
                    <tr th:if="${emp.Usuario?.usuEstado == 'Activo'}" class="table-row" th:each="emp : ${empleados}">
                        <td>
                            <span class="emp-codigo fw-semibold" th:text="${emp.codigo}"></span>
                        </td>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <div class="avatar" th:text="${#strings.substring(emp.usuario.nombre, 0, 1)}"></div>
                                <span class="emp-nombre" th:text="${emp.usuario.nombre + ' ' + emp.usuario.apellidopaterno}"></span>
                            </div>
                        </td>
                        <td th:text="${emp.usuario.dni}"></td>
                        <td>
                            <span class="badge-area" th:text="${emp.area.nombrearea}"></span>
                        </td>
                        <td class="fw-semibold" style="color:#2d6a9f;" th:text="'S/. ' + ${emp.area.salario}"></td>
                        <td th:text="${emp.fechaingreso}"></td>
                        <td>
                            <div class="d-flex gap-1">
                                <a th:href="@{/empleados/detalle/{codigo}(codigo=${emp.codigo})}"
                                   class="btn-accion info" title="Ver detalle">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a th:if="${rolUsuario == 'administrador' or rolUsuario == 'recursos humanos'}"
                                   th:href="@{/empleados/salario/{codigo}(codigo=${emp.codigo})}"
                                   class="btn-accion warning" title="Modificar salario">
                                    <i class="bi bi-cash"></i>
                                </a>
                                <a th:if="${rolUsuario == 'administrador'}"
                                   th:href="@{/empleados/eliminar/{codigo}(codigo=${emp.codigo})}"
                                   class="btn-accion danger" title="Eliminar"
                                   onclick="return confirm('¿Está seguro de eliminar este empleado?')">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- Footer -->
            <div class="footer-tabla">
                <span id="contadorEmpleados"></span>
                <span>Sistema de Empleados</span>
            </div>
        </div>
    </div>
</div>

<script>
    const filas = document.querySelectorAll('#tablaEmpleados tbody tr');
    const contador = document.getElementById('contadorEmpleados');
    contador.textContent = filas.length + ' empleado' + (filas.length !== 1 ? 's' : '') + ' en total';

    document.getElementById('buscador').addEventListener('input', function() {
        const texto = this.value.toLowerCase();
        let visibles = 0;
        filas.forEach(fila => {
            const contenido = fila.textContent.toLowerCase();
            if (contenido.includes(texto)) {
                fila.style.display = '';
                visibles++;
            } else {
                fila.style.display = 'none';
            }
        });
        contador.textContent = visibles + ' empleado' + (visibles !== 1 ? 's' : '') + ' en total';
    });
</script>
</body>
</html>
