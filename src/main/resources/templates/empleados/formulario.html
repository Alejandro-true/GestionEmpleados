<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Empleado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f0f4f8; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: #1e3a5f !important; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .section-title { font-size: 12px; font-weight: 700; color: #1e3a5f; text-transform: uppercase; letter-spacing: 0.5px; padding-bottom: 10px; border-bottom: 2px solid #e8f0fe; margin-bottom: 20px; }
        .form-label { font-size: 13px; font-weight: 600; color: #444; }
        .form-control, .form-select { border-radius: 8px; font-size: 14px; border: 1px solid #e0e0e0; }
        .form-control:focus, .form-select:focus { border-color: #2d6a9f; box-shadow: 0 0 0 0.2rem rgba(45,106,159,0.15); }
        .btn-guardar { background: #1e3a5f; color: white; border: none; border-radius: 8px; padding: 10px 28px; font-weight: 500; font-size: 14px; }
        .btn-guardar:hover { background: #2d6a9f; color: white; }
        .form-text { font-size: 11px; color: #aaa; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand fw-bold"><i class="bi bi-people-fill me-2"></i>Sistema de Empleados</span>
    <div class="d-flex gap-2">
        <a href="/empleados" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left me-1"></i>Volver</a>
        <a href="/inicio" class="btn btn-outline-light btn-sm"><i class="bi bi-house me-1"></i>Inicio</a>
        <a href="/logout" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right me-1"></i>Cerrar Sesión</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h5 class="fw-bold mb-0" style="color:#1e3a5f;">Registrar Nuevo Empleado</h5>
            <small class="text-muted">Complete todos los campos requeridos</small>
        </div>
    </div>

    <div th:if="${mensajeError}" class="alert alert-danger" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${mensajeError}"></span>
    </div>

    <form action="/empleados/guardar" method="post">
        <!-- Datos Personales -->
        <div class="card mb-4 p-4">
            <div class="section-title"><i class="bi bi-person me-2"></i>Datos Personales</div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">DNI <span class="text-danger">*</span></label>
                    <input type="text" name="usuario_dni" class="form-control"
                           placeholder="12345678" maxlength="8" pattern="\d{8}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Correo Electrónico <span class="text-danger">*</span></label>
                    <input type="email" name="usuario_correoElectronico" class="form-control"
                           placeholder="correo@empresa.pe" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Nombres <span class="text-danger">*</span></label>
                    <input type="text" name="usuario_nombres" class="form-control"
                           placeholder="Juan Carlos" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Apellido Paterno <span class="text-danger">*</span></label>
                    <input type="text" name="usuario_apellidoPaterno" class="form-control"
                           placeholder="Pérez" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Apellido Materno <span class="text-danger">*</span></label>
                    <input type="text" name="usuario_apellidoMaterno" class="form-control"
                           placeholder="López" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Género</label>
                    <select name="usuario_genero" class="form-select">
                        <option value="Masculino">Masculino</option>
                        <option value="Femenino">Femenino</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Fecha de Nacimiento <span class="text-danger">*</span></label>
                    <input type="date" name="usuario_fechaNacimiento" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Contraseña <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <input type="password" name="usuario_contrasenia" id="contrasenia"
                               class="form-control" placeholder="••••••••" required>
                        <button class="btn btn-outline-secondary" type="button" id="togglePass"
                                style="border-radius:0 8px 8px 0;">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Datos Laborales -->
        <div class="card mb-4 p-4">
            <div class="section-title"><i class="bi bi-briefcase me-2"></i>Datos Laborales</div>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Código de Empleado <span class="text-danger">*</span></label>
                    <input type="text" name="codigoEmpleado" class="form-control"
                           placeholder="EMP-0011" required>
                    <div class="form-text">Formato: EMP-0001</div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Fecha de Ingreso <span class="text-danger">*</span></label>
                    <input type="date" name="fechaIngreso" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Rol <span class="text-danger">*</span></label>
                    <select name="usuario_rol" class="form-select" required>
                        <option value="Empleado Regular">Empleado Regular</option>
                        <option value="Administrador">Administrador</option>
                        <option value="Recursos Humanos">Recursos Humanos</option>
                    </select>
                </div>
                <div class="col-md-12">
                    <label class="form-label">Área de Trabajo <span class="text-danger">*</span></label>
                    <select name="area_idarea" class="form-select" required>
                        <option value="">-- Seleccionar Área --</option>
                        <option th:each="area : ${areas}"
                                th:value="${area.idarea}"
                                th:text="${area.nombrearea + ' — S/. ' + area.salario}">
                        </option>
                    </select>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2 mb-5">
            <button type="submit" class="btn btn-guardar">
                <i class="bi bi-save me-2"></i>Guardar Empleado
            </button>
            <a href="/empleados" class="btn btn-outline-secondary" style="border-radius:8px;">
                Cancelar
            </a>
        </div>
    </form>
</div>

<script>
    document.getElementById('togglePass').addEventListener('click', function() {
        const input = document.getElementById('contrasenia');
        const icon = document.getElementById('eyeIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('bi-eye-slash', 'bi-eye');
        }
    });
</script>
</body>
</html>
