<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Boletas de Pago</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f0f4f8; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: #1e3a5f !important; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .search-box { border-radius: 8px; border: 1px solid #e0e0e0; padding: 10px 16px 10px 40px; width: 320px; font-size: 14px; }
        .search-wrapper { position: relative; display: inline-block; }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #aaa; }
        .table thead th { background: white; color: #888; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; border: none; border-bottom: 1px solid #f0f0f0; padding: 12px 16px; }
        .table tbody td { border: none; border-bottom: 1px solid #f8f8f8; padding: 12px 16px; font-size: 14px; vertical-align: middle; }
        .table tbody tr:hover { background-color: #f8faff; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); display: inline-flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 14px; }
        .badge-periodo { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; background: #e8f4ff; color: #1565c0; }
        .footer-tabla { padding: 12px 16px; font-size: 13px; color: #888; display: flex; justify-content: space-between; border-top: 1px solid #f0f0f0; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand fw-bold"><i class="bi bi-file-earmark-text me-2"></i>Sistema de Empleados</span>
    <div class="d-flex gap-2">
        <a href="/inicio" class="btn btn-outline-light btn-sm"><i class="bi bi-house me-1"></i>Inicio</a>
        <a href="/logout" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right me-1"></i>Cerrar Sesión</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h5 class="fw-bold mb-0" style="color:#1e3a5f;">Boletas de Pago</h5>
            <small class="text-muted">Consulta todas las boletas de pago del personal</small>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="p-3 border-bottom">
                <div class="search-wrapper">
                    <i class="bi bi-search search-icon"></i>
                    <input type="text" id="buscador" class="search-box form-control"
                           placeholder="Buscar por empleado, periodo...">
                </div>
            </div>

            <table class="table" id="tablaBoletas">
                <thead>
                    <tr>
                        <th class="ps-4">EMPLEADO</th>
                        <th>PERIODO</th>
                        <th>FECHA EMISIÓN</th>
                        <th>TOTAL</th>
                        <th>DESCARGAR</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="boleta : ${boletas}">
                        <td class="ps-4">
                            <div class="d-flex align-items-center gap-2">
                                <div class="avatar" th:text="${#strings.substring(boleta.empleado.usuario.nombre, 0, 1)}"></div>
                                <div>
                                    <div class="fw-semibold" style="font-size:14px;" th:text="${boleta.empleado.usuario.nombre + ' ' + boleta.empleado.usuario.apellidopaterno}"></div>
                                    <div style="font-size:12px; color:#888;" th:text="${boleta.empleado.codigo}"></div>
                                </div>
                            </div>
                        </td>
                        <td><span class="badge-periodo" th:text="${boleta.periodo}"></span></td>
                        <td th:text="${boleta.fechaemision}"></td>
                        <td class="fw-semibold" style="color:#2d6a9f;" th:text="'S/. ' + ${boleta.total}"></td>
                        <td>
                            <a th:href="@{/empleados/boleta/{id}/excel(id=${boleta.idboleta})}"
                               class="btn btn-sm" style="background:#e8f5e9; color:#2e7d32; border-radius:8px; font-size:12px;">
                                <i class="bi bi-file-earmark-excel me-1"></i>Excel
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${boletas == null or boletas.isEmpty()}">
                        <td colspan="5" class="text-center text-muted py-4">No hay boletas registradas</td>
                    </tr>
                </tbody>
            </table>

            <div class="footer-tabla">
                <span id="contadorBoletas"></span>
                <span>Sistema de Empleados</span>
            </div>
        </div>
    </div>
</div>

<script>
    const filas = document.querySelectorAll('#tablaBoletas tbody tr');
    const contador = document.getElementById('contadorBoletas');
    contador.textContent = filas.length + ' boleta' + (filas.length !== 1 ? 's' : '') + ' en total';

    document.getElementById('buscador').addEventListener('input', function() {
        const texto = this.value.toLowerCase();
        let visibles = 0;
        filas.forEach(fila => {
            const contenido = fila.textContent.toLowerCase();
            if (contenido.includes(texto)) {
                fila.style.display = '';
                visibles++;
            } else {
                fila.style.display = 'none';
            }
        });
        contador.textContent = visibles + ' boleta' + (visibles !== 1 ? 's' : '') + ' en total';
    });
</script>
</body>
</html>
