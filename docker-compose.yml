VERSION: '3.8'
services:
  postgres-db:
    image: postgres:15
    container_name: postgres-proyecto
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_HOST_PORT}:${DB_CONTAINER_PORT}"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: